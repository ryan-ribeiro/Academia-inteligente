# Unchanged optional local-provider definitions from docker-compose.yml.
# Kept separate so production never imports development credentials/port settings.
services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-0.34.1}
    profiles: ["ollama"]
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_LLM_LIBRARY: cuda_v12
      CUDA_VISIBLE_DEVICES: "0"
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-f16}
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-0.34.1}
    profiles: ["ollama"]
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen3:8b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  compreface-postgres-db:
    image: exadel/compreface-postgres-db:1.2.0@sha256:fe898d327bc3dd738513ef7cafcbe97da51ac10d2542493141ac7878d3bc9f3a
    profiles: [biometrics]
    networks: [biometrics]
    environment:
      POSTGRES_USER: biometrics
      POSTGRES_PASSWORD: ${COMPREFACE_DATABASE_PASSWORD:-}
      POSTGRES_DB: biometrics
    volumes:
      - biometrics_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U biometrics -d biometrics']
      interval: 10s
      timeout: 3s
      retries: 10

  compreface-core:
    image: exadel/compreface-core:1.2.0@sha256:c9c70f0f270b1767bdf59d8e549f00f7d8f06e29315ac2ff624e276dcf37385b
    profiles: [biometrics]
    networks: [biometrics]
    environment:
      ML_PORT: '3000'
      IMG_LENGTH_LIMIT: '640'
      UWSGI_PROCESSES: '1'
      UWSGI_THREADS: '1'
      LOGGING_LEVEL_NAME: CRITICAL
      # Upstream treats an empty string as its default plugin list. Whitespace splits to none.
      EXTRA_PLUGINS: " "
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:3000/healthcheck]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 12

  compreface-api:
    image: exadel/compreface-api:1.2.0@sha256:4e131ba2c51a2e711f0bdad0720f9ab47c827f383c5c956b1be4dfd994edc1cc
    profiles: [biometrics]
    networks: [biometrics]
    environment:
      POSTGRES_USER: biometrics
      POSTGRES_PASSWORD: ${COMPREFACE_DATABASE_PASSWORD:-}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/biometrics
      SPRING_PROFILES_ACTIVE: dev
      API_JAVA_OPTS: -Xmx1g
      SAVE_IMAGES_TO_DB: 'true'
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 6MB
      CONNECTION_TIMEOUT: '3000'
      READ_TIMEOUT: '10000'
      MAX_ATTEMPTS: '1'
      PYTHON_URL: http://compreface-core:3000
      LOGGING_LEVEL_ROOT: "OFF"
    depends_on:
      compreface-postgres-db:
        condition: service_healthy
      compreface-core:
        condition: service_healthy

  compreface-admin:
    image: exadel/compreface-admin:1.2.0@sha256:1d199d4d1ab703e8c8bec5825ac6150c49de70568cd2b27658dd234c444fa7ed
    profiles: [biometrics]
    networks: [biometrics]
    environment:
      POSTGRES_USER: biometrics
      POSTGRES_PASSWORD: ${COMPREFACE_DATABASE_PASSWORD:-}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/biometrics
      SPRING_PROFILES_ACTIVE: dev
      ENABLE_EMAIL_SERVER: 'false'
      ADMIN_JAVA_OPTS: -Xmx512m
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 6MB
      LOGGING_LEVEL_ROOT: "OFF"
    depends_on:
      compreface-api:
        condition: service_started

  compreface-fe:
    image: exadel/compreface-fe:1.2.0@sha256:3c92742ba75295b474b83ab27f8418aa94041e6e48d6006fe6ca7e6f06536508
    profiles: [biometrics]
    networks: [biometrics, biometrics_management]
    ports:
      - '127.0.0.1:8005:80'
    environment:
      CLIENT_MAX_BODY_SIZE: 6M
      PROXY_READ_TIMEOUT: 10000ms
      PROXY_CONNECT_TIMEOUT: 3000ms
    depends_on:
      - compreface-api
      - compreface-admin
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  biometrics: {internal: true}
  biometrics_management: {}
volumes:
  biometrics_data: {}
  ollama_data: {}
