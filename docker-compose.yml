services:
  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost:5173/}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OIDC_ISSUER_URL: http://keycloak:8080/realms/academia
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FACIAL_ACCESS_MODE: ${FACIAL_ACCESS_MODE:-disabled}
      COMPREFACE_URL: http://compreface-api:8080
      COMPREFACE_API_KEY: ${COMPREFACE_API_KEY:-}
      BIOMETRIC_DETECTION_THRESHOLD: ${BIOMETRIC_DETECTION_THRESHOLD:-0.90}
      BIOMETRIC_MATCH_THRESHOLD: ${BIOMETRIC_MATCH_THRESHOLD:-0.80}
      BIOMETRIC_AMBIGUITY_MARGIN: ${BIOMETRIC_AMBIGUITY_MARGIN:-0.10}
      BIOMETRIC_TIMEOUT_SECONDS: ${BIOMETRIC_TIMEOUT_SECONDS:-10}
      BIOMETRIC_MODEL: facenet-20180402-114759
      ACCESS_EVENT_INTEGRATION_SECRET: ${ACCESS_EVENT_INTEGRATION_SECRET:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-no-reply@academia.local}
      ONBOARDING_INVITATION_URL: ${ONBOARDING_INVITATION_URL:-http://localhost:5173/onboarding}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-10}
      AI_RECENT_MESSAGE_LIMIT: ${AI_RECENT_MESSAGE_LIMIT:-6}
      AI_TRAINING_CHAT_SUMMARY_LIMIT: ${AI_TRAINING_CHAT_SUMMARY_LIMIT:-2000}
      KNOWLEDGE_OLLAMA_BASE_URL: http://knowledge-ollama:11434
      KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS: ${KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS:-120}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: academia
      KEYCLOAK_PROVISIONING_CLIENT_ID: academia-provisioner
      KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${KEYCLOAK_PROVISIONING_CLIENT_SECRET}
      KEYCLOAK_FIRST_ACCESS_CLIENT_ID: academia-web
      KEYCLOAK_FIRST_ACCESS_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost:5173/}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend:/app
    networks: [default, biometrics]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend-init:
    build:
      context: ./backend
    command: ["python", "-m", "app.modules.knowledge.startup"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KNOWLEDGE_OLLAMA_BASE_URL: http://knowledge-ollama:11434
      KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS: ${KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS:-120}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      knowledge-model:
        condition: service_completed_successfully
    restart: "no"

  knowledge-ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-0.34.1}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    expose:
      - "11434"
    volumes:
      - knowledge_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  knowledge-model:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-0.34.1}
    entrypoint: ["/bin/ollama"]
    command: ["pull", "bge-m3"]
    environment:
      OLLAMA_HOST: http://knowledge-ollama:11434
    depends_on:
      knowledge-ollama:
        condition: service_healthy
    restart: "no"

  postgres:
    build:
      context: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      KEYCLOAK_PROVISIONING_CLIENT_SECRET: ${KEYCLOAK_PROVISIONING_CLIENT_SECRET}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./backend/app/modules/identity/keycloak/realm-academia.json:/opt/keycloak/data/import/realm-academia.json:ro
      - ./keycloak/themes/academia:/opt/keycloak/themes/academia:ro

  mailpit:
    image: axllent/mailpit:v1.30.7
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"

  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-0.34.1}
    profiles: ["ollama"]
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_LLM_LIBRARY: cuda_v12
      CUDA_VISIBLE_DEVICES: "0"
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-f16}
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-0.34.1}
    profiles: ["ollama"]
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen3:8b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  compreface-postgres-db:
    image: exadel/compreface-postgres-db:1.2.0@sha256:fe898d327bc3dd738513ef7cafcbe97da51ac10d2542493141ac7878d3bc9f3a
    profiles: [biometrics]
    networks: [biometrics]
    environment:
      POSTGRES_USER: biometrics
      POSTGRES_PASSWORD: ${COMPREFACE_DATABASE_PASSWORD:-}
      POSTGRES_DB: biometrics
    volumes:
      - biometrics_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U biometrics -d biometrics']
      interval: 10s
      timeout: 3s
      retries: 10

  compreface-core:
    image: exadel/compreface-core:1.2.0@sha256:c9c70f0f270b1767bdf59d8e549f00f7d8f06e29315ac2ff624e276dcf37385b
    profiles: [biometrics]
    networks: [biometrics]
    environment:
      ML_PORT: '3000'
      IMG_LENGTH_LIMIT: '640'
      UWSGI_PROCESSES: '1'
      UWSGI_THREADS: '1'
      LOGGING_LEVEL_NAME: CRITICAL
      # Upstream treats an empty string as its default plugin list. Whitespace splits to none.
      EXTRA_PLUGINS: " "
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:3000/healthcheck]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 12

  compreface-api:
    image: exadel/compreface-api:1.2.0@sha256:4e131ba2c51a2e711f0bdad0720f9ab47c827f383c5c956b1be4dfd994edc1cc
    profiles: [biometrics]
    networks: [biometrics]
    environment:
      POSTGRES_USER: biometrics
      POSTGRES_PASSWORD: ${COMPREFACE_DATABASE_PASSWORD:-}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/biometrics
      SPRING_PROFILES_ACTIVE: dev
      API_JAVA_OPTS: -Xmx1g
      SAVE_IMAGES_TO_DB: 'true'
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 6MB
      CONNECTION_TIMEOUT: '3000'
      READ_TIMEOUT: '10000'
      MAX_ATTEMPTS: '1'
      PYTHON_URL: http://compreface-core:3000
      LOGGING_LEVEL_ROOT: "OFF"
    depends_on:
      compreface-postgres-db:
        condition: service_healthy
      compreface-core:
        condition: service_healthy

  compreface-admin:
    image: exadel/compreface-admin:1.2.0@sha256:1d199d4d1ab703e8c8bec5825ac6150c49de70568cd2b27658dd234c444fa7ed
    profiles: [biometrics]
    networks: [biometrics]
    environment:
      POSTGRES_USER: biometrics
      POSTGRES_PASSWORD: ${COMPREFACE_DATABASE_PASSWORD:-}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/biometrics
      SPRING_PROFILES_ACTIVE: dev
      ENABLE_EMAIL_SERVER: 'false'
      ADMIN_JAVA_OPTS: -Xmx512m
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 6MB
      LOGGING_LEVEL_ROOT: "OFF"
    depends_on:
      compreface-api:
        condition: service_started

  compreface-fe:
    image: exadel/compreface-fe:1.2.0@sha256:3c92742ba75295b474b83ab27f8418aa94041e6e48d6006fe6ca7e6f06536508
    profiles: [biometrics]
    networks: [biometrics, biometrics_management]
    ports:
      - '127.0.0.1:8005:80'
    environment:
      CLIENT_MAX_BODY_SIZE: 6M
      PROXY_READ_TIMEOUT: 10000ms
      PROXY_CONNECT_TIMEOUT: 3000ms
    depends_on:
      - compreface-api
      - compreface-admin
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  biometrics:
    internal: true
  # Only the loopback management proxy joins this bridge; processing stays internal.
  biometrics_management: {}

volumes:
  biometrics_data:
  frontend_node_modules:
  postgres_data:
  keycloak_data:
  ollama_data:
  knowledge_models:
